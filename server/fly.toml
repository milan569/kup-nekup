# Fly.io config. Deploy steps: see README section "Provoz online".
# App name was generated for this project (also in server/.env.fly).
app = "kup-nekup-ntjn"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DB_PATH = "/data/cache.sqlite"
  CLAUDE_MODEL = "claude-opus-5-5"
  AI_RATE_PER_HOUR = "60"

[[mounts]]
  source = "kupnekup_cache"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # keep one machine warm so the first scan in the shop is fast
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
