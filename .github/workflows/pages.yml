name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      # The site lives at https://<owner>.github.io/<repository>/, so the base path is the
      # repository name: a copy under another account or name deploys without any change
      # (see PRENOS.md). A repository named <owner>.github.io is served from the root.
      - name: Base path of the site
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY_OWNER}"
          if [ "${repo,,}" = "${owner,,}.github.io" ]; then base=""; else base="/$repo"; fi
          echo "EXPO_BASE_URL=$base" >> "$GITHUB_ENV"
          echo "Base path: '$base'"
      # shown at the bottom of Profil: which build runs on the phone (not a secret)
      - name: Build stamp
        run: echo "EXPO_PUBLIC_BUILD=$(date -u +%Y-%m-%d) ${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - run: npx expo export -p web
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
